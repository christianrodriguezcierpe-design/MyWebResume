<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for public/og-image.png. Regenerate with the command in README.
       Colours mirror the site tokens in src/index.css: the hero gradient
       (222 47% 11% -> 222 30% 20%) and the amber accent (38 92% 50%).
       Fonts are generic families with common fallbacks so the render does not
       depend on Inter/Playfair being installed on the machine doing it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1729"/>
      <stop offset="100%" stop-color="#242D42"/>
    </linearGradient>
    <radialGradient id="glowA" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Echoes the blurred accent circles in the Hero section. -->
  <circle cx="120" cy="130" r="300" fill="url(#glowA)"/>
  <circle cx="1080" cy="520" r="340" fill="url(#glowB)"/>

  <!-- Amber rule, matching the accent bar treatment used across the site. -->
  <rect x="90" y="150" width="72" height="6" rx="3" fill="#F59E0B"/>

  <text x="90" y="268" font-family="Georgia, 'Times New Roman', serif" font-size="92" font-weight="700" fill="#F8FAFC">Christian Rodriguez</text>

  <text x="90" y="340" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="40" font-weight="600" fill="#F59E0B">Project Coordinator &amp; PMO Specialist</text>

  <text x="90" y="410" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" fill="#94A3B8">10+ years coordinating software delivery across</text>
  <text x="90" y="448" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="27" fill="#94A3B8">banking, public sector, and automotive.</text>

  <rect x="90" y="506" width="1020" height="1" fill="#F8FAFC" fill-opacity="0.12"/>

  <text x="90" y="556" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" fill="#CBD5E1">Valparaíso, Chile</text>
  <text x="1110" y="556" text-anchor="end" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="24" fill="#CBD5E1">christian.rodriguez.cierpe@gmail.com</text>
</svg>
