<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Source for public/favicon.svg and public/favicon.ico. Regenerate with the
       sharp-cli command in README's "Social preview image" section, adapted to
       this file and a 256x256 resize, then wrap the PNG into an ICO container.
       Colours mirror design/og-image.svg. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1729"/>
      <stop offset="100%" stop-color="#242D42"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#bg)"/>

  <text
    x="128" y="172"
    text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="128"
    font-weight="700"
    fill="#F59E0B"
  >CR</text>
</svg>
